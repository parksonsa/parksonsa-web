<section id="contact" class="contact">
  <div class="wrap">
    <div class="sec-head">
      <div class="eyebrow">상담 신청</div>
      <h2>지금 상황부터 말씀해 주세요.</h2>
      <p>가능성이 낮으면 낮다고 말씀드립니다. 상담 단계에서는 비용이 없습니다.</p>
    </div>
    <div class="contact-grid">
      <div class="reach">
        <div><div class="lb">전화 상담</div><a class="tel" href="tel:010-2754-1552">010-2754-1552</a></div>
        <div class="hr"></div>
        <div><div class="lb">카카오톡 상담</div><a class="btn btn-kakao" style="margin-top:12px" href="https://open.kakao.com/o/siiGRjfe" target="_blank" rel="noopener">{{KAKAO_SVG}}오픈채팅으로 상담하기</a></div>
        <div class="hr"></div>
        <div><div class="lb">상담 가능 시간</div><p>평일 09:00 – 18:00<br>그 외 시간에는 카카오톡으로 남겨주시면 순차적으로 답변드립니다.</p></div>
      </div>
      <form id="cform">
        <div class="f-row">
          <div><label for="nm">성함</label><input id="nm" name="성함" type="text" placeholder="홍길동" required></div>
          <div><label for="tel">연락처</label><input id="tel" name="연락처" type="tel" inputmode="tel" placeholder="010-0000-0000" required></div>
        </div>
        <div><label for="cat">상담 분야</label>
          <select id="cat" name="상담분야"><option>질병 · 진단비</option><option>상해 · 후유장해</option><option>교통사고</option><option>배상책임</option><option>보험계약 · 기타</option><option>잘 모르겠습니다</option></select></div>
        <div><label for="msg">상담 내용</label><textarea id="msg" name="상담내용" placeholder="어떤 통보를 받으셨는지, 언제 있었던 일인지 적어주시면 검토가 빨라집니다."></textarea></div>
        <label class="consent" for="agree"><input id="agree" name="개인정보동의" value="동의함" type="checkbox" required><span>상담 진행을 위해 성함 · 연락처 · 상담 내용을 수집하며, 상담 종료 후 3개월간 보관 뒤 파기합니다. 동의를 거부하실 수 있으나, 이 경우 상담 신청이 제한됩니다.</span></label>
        <input type="hidden" name="_subject" value="[홈페이지] 상담 신청이 접수되었습니다">
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <button type="submit" id="fbtn">상담 신청하기</button>
        <p class="formmsg" id="fmsg" hidden></p>
      </form>
    </div>
  </div>
</section>
