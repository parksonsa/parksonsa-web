name: 사이트 생성

# data/posts/ 에 글을 올리거나 내용을 고쳐 커밋하면 사이트를 다시 만든다.
# 네이버 블로그 자동 복제는 쓰지 않는다. (홈페이지가 원본이 되도록)
# 필요하면 아래 '네이버 가져오기'를 손으로 실행할 수 있다 — 평소에는 쓰지 않는다.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      naver:
        description: '네이버 블로그에서 가져오기 (평소에는 no)'
        required: true
        default: 'no'
        type: choice
        options: [no, recent, all]

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 네이버 가져오기 (직접 실행했을 때만)
        if: github.event_name == 'workflow_dispatch' && inputs.naver != 'no'
        run: |
          if [ "${{ inputs.naver }}" = "all" ]; then
            python3 scripts/sync_naver.py --all
          else
            python3 scripts/sync_naver.py
          fi

      - name: 사이트 생성
        run: python3 scripts/build.py

      - name: 변경분 저장
        run: |
          git config user.name  "site-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "사이트 갱신 $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
